spring.application.name=ride-service
server.port=${SERVER_PORT:8083}
spring.datasource.url=${DB_URL:jdbc:h2:mem:ridelinkrides;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.path=/swagger-ui.html

ridelink.jwt.secret=${JWT_SECRET}
ridelink.driver.base-url=${DRIVER_SERVICE_URL:http://localhost:8082}
ridelink.internal-key=${INTERNAL_SERVICE_KEY}
